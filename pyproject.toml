[project]
name = "ppt-slide-generator"
version = "2.0.0"
description = "AI 文档转幻灯片工具"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
slideforge = "scripts.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]
