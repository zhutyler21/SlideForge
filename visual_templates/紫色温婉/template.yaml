reference_images_analysis: '1. **COLOR PALETTE**: The background is a soft, light
  lavender gradient (#F4F0FF to #E8E0FF). The primary text color is a deep navy blue
  (#0A0D36). Accent colors include a vibrant coral-pink (#FF6B6B), a bright cyan-blue
  (#48D1E0), and a rich royal purple (#8A2BE2). Highlight colors for UI elements and
  data points utilize these same vibrant gradients, often transitioning from coral
  to light orange or cyan to blue.


  2. **ILLUSTRATION & ART STYLE**: The style is modern, abstract, and minimalist.
  It relies on fluid, organic shapes rather than traditional illustrations. Imagery
  is limited to circular, professional headshots with soft-focus backgrounds. The
  aesthetic is clean and digital-first, avoiding complex textures in favor of smooth,
  high-contrast color transitions.


  3. **VISUAL EFFECTS & DECORATIONS**: The design features a heavy emphasis on "glassmorphism"
  and soft layering. Key elements include: large, semi-transparent white containers
  with subtle white borders; floating, blurred circular gradients that act as background
  depth; and soft, rounded corners on all cards and UI elements. There are no harsh
  shadows; instead, depth is implied through the layering of translucent shapes and
  the strategic placement of vibrant, gradient-filled circles.


  4. **OVERALL VISUAL LANGUAGE**: The visual identity is "Corporate Tech-Modern."
  It conveys a mood of professional optimism, clarity, and innovation. The combination
  of deep navy text against a light, airy, pastel-gradient background creates a high-readability,
  premium feel. The use of floating, organic shapes and glass-like containers gives
  the slides a light, weightless, and forward-thinking quality, making complex business
  data feel approachable and contemporary.'
